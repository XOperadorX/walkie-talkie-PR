<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071a33">
  <title>VORIQ · Cadastro</title>
  <style>*{box-sizing:border-box}body{margin:0;background:#061225;color:#eef7ff;font:16px system-ui,Arial,sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:24px 18px 48px}.hero{background:linear-gradient(135deg,#071a33,#0b3b71);color:#fff;padding:30px;border-radius:20px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;line-height:1.5}.menu{display:flex;gap:12px;margin:16px 0}.menu a,.button{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:12px 18px;background:#087ee8;color:white;font-weight:700;text-decoration:none}.menu a{flex:1}.card{background:#10243d;padding:24px;margin-top:16px;border-radius:16px;box-shadow:0 5px 18px #17324a12}.card h2{margin-top:0}.instructions{padding-left:24px;line-height:1.65}.instructions li{padding-left:4px;margin:5px 0}.muted{color:#b8c9dc;font-size:.94rem;line-height:1.55}label{display:block;font-weight:650;margin-top:14px}input{width:100%;padding:13px;margin-top:6px;border:1px solid #29435f;background:#0b1b30;color:#eef7ff;border-radius:9px;font-size:16px}.button{width:100%;margin-top:16px;border:0;font-size:16px;cursor:pointer}@media(max-width:420px){.hero{padding:23px}.card{padding:19px}.menu{gap:8px}.menu a{padding:11px 8px}}</style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <h1>VORIQ</h1>
      <p>Sua voz. Sua conexão. Comunicador Wi-Fi para pessoas na mesma rede.</p>
    </header>
    <nav class="menu" aria-label="Menu principal">
      <a href="inicio.html">Início</a>
      <a href="cadastro.html" aria-current="page">Criar acesso</a>
      <a href="apk.html">APK</a>
      <a href="adm_cadastro.html">Administração</a>
    </nav>
    <section class="card">
      <h2>Criar acesso</h2>
      <p class="muted">O ID será criado após o cadastro. Use uma senha com pelo menos 8 caracteres. Guarde os dois para entrar no aplicativo.</p>
      <form method="post" action="/cadastrar">
        <label for="nome">Seu nome</label>
        <input id="nome" name="nome" minlength="2" maxlength="50" required autocomplete="name">
        <label for="senha">Crie uma senha</label>
        <input id="senha" name="senha" type="password" minlength="8" maxlength="128" required autocomplete="new-password">
        <button class="button" type="submit">Cadastrar</button>
      </form>
    </section>
  </main>
</body>
</html>
