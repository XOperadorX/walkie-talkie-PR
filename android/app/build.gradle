plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'br.com.walkietalkie'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.walkietalkie'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.12'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
